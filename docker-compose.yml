name: quronest_llm_agent

services:
  server:
    image: judge0/judge0:latest
    container_name: quronest_llm_agent_judge0
    restart: unless-stopped
    ports:
      - "2358:2358"
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    environment:
      REDIS_URL: redis://redis:6379
      POSTGRES_HOST: db
      POSTGRES_PORT: 5436
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
      RAILS_ENV: production
    depends_on:
      - db
      - redis

  worker:
    image: judge0/judge0:latest
    container_name: quronest_llm_agent_judge0_worker
    restart: unless-stopped
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    environment:
      REDIS_URL: redis://redis:6379
      POSTGRES_HOST: db
      POSTGRES_PORT: 5436
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
      RAILS_ENV: production
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    container_name: quronest_llm_agent_postgres
    restart: unless-stopped
    command: ["postgres", "-p", "5436"]
    ports:
      - "5436:5436"
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: quronest_llm_agent_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
